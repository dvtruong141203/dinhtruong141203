<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Thanh toán online</title>
  <style>
    :root { --bg: #09090b; --surface: rgba(24, 24, 27, 0.7); --border: rgba(255,255,255,0.1); --text: #fafafa; --muted: #a1a1aa; --primary: #8b5cf6; --success: #34d399; --warning: #fbbf24; --danger: #fb7185; }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;}
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 20px 100px 20px; background-image: radial-gradient(circle at 50% 10%, rgba(139, 92, 246, 0.15), transparent 60%); background-attachment: fixed; }
    
    .container { width: 100%; max-width: 1000px; animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; flex-wrap: wrap; gap: 16px; }
    .top-bar h2 { font-weight: 800; font-size: 22px; width: 100%; text-align: center; margin-bottom: 10px; }
    .search { background: var(--surface); border: 1px solid var(--border); padding: 12px 20px; border-radius: 16px; width: 100%; max-width: 400px; margin: 0 auto; }
    .search input { background: transparent; border: none; color: var(--text); width: 100%; outline: none; font-size: 14px; font-weight: 500; text-align: center; }
    
    .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; overflow-x: auto; backdrop-filter: blur(24px); box-shadow: 0 25px 50px rgba(0,0,0,0.4); }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th { padding: 20px 24px; color: var(--muted); font-size: 13px; text-transform: uppercase; border-bottom: 1px solid var(--border); letter-spacing: 1px; text-align: center; }
    td { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 14.5px; font-weight: 500; cursor: pointer; text-align: center; }
    tr:hover { background: rgba(255,255,255,0.05); }
    
    .badge { padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: 800; display: inline-block; text-transform: uppercase; border: 1px solid transparent; }
    .b-pend { background: rgba(245, 158, 11, 0.1); color: var(--warning); border-color: rgba(251, 191, 36, 0.2); }
    .b-succ { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(52, 211, 153, 0.2); }
    .b-fail { background: rgba(244, 63, 94, 0.1); color: var(--danger); border-color: rgba(251, 113, 133, 0.2); }

    /* MENU DƯỚI CÙNG */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(24,24,27,0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 10px calc(12px + env(safe-area-inset-bottom)); z-index: 1000; }
    .bottom-nav a { text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; }
    .bottom-nav a:hover, .bottom-nav a.active { color: var(--primary); }
    .bottom-nav a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* POPUP CHUNG */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    .overlay.show { display: flex; }
    .modal { background: rgba(30,41,59,0.95); border: 1px solid var(--border); border-radius: 24px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 0 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: 0.3s ease; position: relative; }
    .overlay.show .modal { transform: scale(1); }
    .m-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14.5px; }
    .m-row:last-child { border: none; padding-bottom: 0; }
    .m-lbl { color: var(--muted); font-weight: 600; }
    .m-val { font-weight: 700; text-align: right; color: var(--text); }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <h2>DANH SÁCH GIAO DỊCH</h2>
      <div class="search"><input type="text" id="searchInp" placeholder="Nhập mã giao dịch để tìm kiếm..." oninput="renderTable()"></div>
    </div>
    
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Mã giao dịch</th>
            <th>Thời gian tạo</th>
            <th>Thời gian thanh toán</th>
            <th>Số tiền</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5" style="padding: 60px; color:var(--muted)">Đang đồng bộ dữ liệu...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="data.html" class="active"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Danh sách</a>
    <a href="add.html"><svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg>Nạp tiền</a>
    <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Tra cứu</a>
    <a href="edit.html"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Cập nhật</a>
  </div>

  <div class="overlay" id="modal" onclick="if(event.target.id==='modal') this.classList.remove('show')">
    <div class="modal">
      <div style="margin-bottom: 24px; text-align: center; position: relative;">
        <h3 style="font-weight: 800; font-size: 18px; margin: 0;">THÔNG TIN THANH TOÁN</h3>
        <button style="position: absolute; right: -10px; top: -10px; background:none; border:none; color:var(--muted); font-size:28px; cursor:pointer;" onclick="document.getElementById('modal').classList.remove('show')">×</button>
      </div>
      
      <div class="m-row"><span class="m-lbl">Mã giao dịch</span><span class="m-val" style="font-family:monospace; color:var(--primary);" id="m-id"></span></div>
      <div class="m-row"><span class="m-lbl">Thời gian tạo</span><span class="m-val" id="m-time"></span></div>
      <div class="m-row"><span class="m-lbl">Thời gian thanh toán</span><span class="m-val" id="m-paytime"></span></div>
      <div class="m-row"><span class="m-lbl">Số tiền</span><span class="m-val" id="m-amount" style="font-size:18px;"></span></div>
      <div class="m-row" style="margin-top: 8px;"><span class="m-lbl">Trạng thái</span><span class="m-val" id="m-status"></span></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxLcE6Omn3QKXFi1SBB7A4CtsEjr-iB_qNQ5qrjy5AHagHsjTufNFA9MNqUTmq0ggle/exec";
    let dataList = [];

    // Hàm chuẩn hóa Trạng Thái
    function chuanHoaTrangThai(rawStatus) {
      if (rawStatus.includes('Chờ')) return 'Chờ thanh toán';
      if (rawStatus.includes('Đã') || rawStatus.includes('Hoàn')) return 'Đã thanh toán';
      return 'Thất bại';
    }

    function loadData() {
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getRecentRecords' }) })
      .then(r => r.json()).then(d => { 
        if(d.success) { 
          dataList = d.data; renderTable();
          if(document.getElementById('modal').classList.contains('show')) {
            let curId = document.getElementById('m-id').innerText;
            let up = dataList.find(x => String(x.id) === curId);
            if(up) openModal(up);
          }
        } 
      }).catch(e => console.log("Lỗi đồng bộ ngầm"));
    }

    function renderTable() {
      const tb = document.getElementById("tableBody");
      const q = document.getElementById("searchInp").value.trim().toLowerCase();
      const f = dataList.filter(x => x.id.toLowerCase().includes(q));
      
      if(f.length === 0) { tb.innerHTML = `<tr><td colspan="5" style="padding:40px; color:var(--muted);">Không có giao dịch nào</td></tr>`; return; }
      
      tb.innerHTML = "";
      f.forEach(x => {
        let stt = chuanHoaTrangThai(x.status);
        let bCls = (stt === 'Chờ thanh toán') ? 'b-pend' : (stt === 'Đã thanh toán' ? 'b-succ' : 'b-fail');
        
        // Cột thời gian thanh toán
        let displayPayTime = (stt === 'Đã thanh toán' && x.paymentTime && !x.paymentTime.includes('---')) ? x.paymentTime : '-----';
        
        let tr = document.createElement("tr");
        tr.onclick = () => openModal(x);
        tr.innerHTML = `
          <td style="font-family:monospace; font-weight:800;">${x.id}</td>
          <td style="color:var(--muted)">${x.time}</td>
          <td style="color:var(--muted)">${displayPayTime}</td>
          <td style="font-weight:800; font-family:monospace; font-size:16px;">${x.amount.toLocaleString('vi-VN')} đ</td>
          <td><span class="badge ${bCls}">${stt}</span></td>
        `;
        tb.appendChild(tr);
      });
    }

    function openModal(x) {
      let stt = chuanHoaTrangThai(x.status);
      let bCls = (stt === 'Chờ thanh toán') ? 'b-pend' : (stt === 'Đã thanh toán' ? 'b-succ' : 'b-fail');
      let displayPayTime = (stt === 'Đã thanh toán' && x.paymentTime && !x.paymentTime.includes('---')) ? x.paymentTime : '-----';

      document.getElementById('m-id').innerText = x.id;
      document.getElementById('m-time').innerText = x.time;
      document.getElementById('m-paytime').innerText = displayPayTime;
      document.getElementById('m-amount').innerText = x.amount.toLocaleString('vi-VN') + ' đ';
      document.getElementById('m-status').innerHTML = `<span class="badge ${bCls}">${stt}</span>`;
      
      document.getElementById('modal').classList.add('show');
    }

    loadData(); setInterval(loadData, 3000);
  </script>
</body>
</html>
