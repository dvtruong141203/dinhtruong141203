<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trang Web Của Bạn</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 60px 40px;
      text-align: center;
      max-width: 600px;
      animation: slideIn 0.5s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    h1 {
      color: #333;
      font-size: 48px;
      margin-bottom: 20px;
    }
    
    .emoji {
      font-size: 80px;
      margin-bottom: 20px;
    }
    
    p {
      color: #666;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .status {
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
      padding: 15px;
      border-radius: 5px;
      text-align: left;
      margin-top: 30px;
      color: #2e7d32;
      font-size: 14px;
    }
    
    .links {
      margin-top: 30px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s ease;
      font-weight: bold;
    }
    
    a:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🎉</div>
    <h1>Chúc mừng!</h1>
    <p>Trang web của bạn đã hoạt động trên GitHub Pages</p>
    
    <div class="status">
      ✅ <strong>Status:</strong> Website đang chạy bình thường<br>
      📍 <strong>URL:</strong> https://dvtruong141203.github.io/dinhtruong141203/<br>
      ⚙️ <strong>GitHub Pages:</strong> Đã kích hoạt
    </div>
    
    <div class="links">
      <a href="https://github.com/dvtruong141203/dinhtruong141203">📂 Repository</a>
      <a href="https://github.com/dvtruong141203">👤 Tài khoản</a>
    </div>
  </div>
</body>
</html>
