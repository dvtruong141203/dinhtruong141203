<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Lưu Trữ Ảnh Trực Tuyến</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-hover: #a29bfe;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            padding: 20px;
        }

        .upload-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .upload-container:hover {
            transform: translateY(-5px);
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 14px;
            color: #b2bec3;
            margin-bottom: 30px;
        }

        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.1);
        }

        .drop-zone-icon {
            font-size: 40px;
            margin-bottom: 15px;
            display: block;
        }

        .drop-zone-text {
            font-size: 15px;
            color: #dfe6e9;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-top: 20px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .preview-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            max-height: 250px;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 16px;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
        }

        .remove-btn:hover {
            background: rgba(255, 71, 87, 0.8);
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 0;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.3);
            display: none;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.4);
        }

        .submit-btn:disabled {
            background: #636e72;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-msg {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
        }

        .status-msg.show {
            opacity: 1;
        }
        
        .status-msg.success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
        .status-msg.error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }
        .status-msg.loading { background: rgba(241, 196, 15, 0.2); color: #f1c40f; border: 1px solid rgba(241, 196, 15, 0.3); }

        .result-link {
            margin-top: 10px;
            font-size: 13px;
            color: #a29bfe;
            display: none;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="upload-container">
        <h2>Kho Lưu Trữ Ảnh</h2>
        <p class="subtitle">Tải ảnh lên và lưu trực tiếp vào Drive</p>

        <div class="drop-zone" id="dropZone">
            <span class="drop-zone-icon">📁</span>
            <span class="drop-zone-text">Kéo thả ảnh vào đây hoặc Click để chọn</span>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="preview-container" id="previewContainer">
            <button type="button" class="remove-btn" id="removeBtn">×</button>
            <img id="imagePreview" src="" alt="Image Preview">
        </div>

        <button type="button" class="submit-btn" id="submitBtn">Tải Ảnh Lên</button>
        <div class="status-msg" id="statusMsg"></div>
        <a id="resultLink" class="result-link" href="#" target="_blank">Xem ảnh vừa tải lên</a>
    </div>

    <script>
        // API Web App của bạn đã được gắn vào đây
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwNLGm9n2BPvdJLgYMV-frOuYGrNzdrvbplYpHqquroCm-C_sJD7eAgrTTRWv-oEdY3Q/exec';

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeBtn = document.getElementById('removeBtn');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const resultLink = document.getElementById('resultLink');

        let currentFile = null;

        dropZone.addEventListener('click', () => fileInput.click());

        ['dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length) handleFile(files[0]);
        });

        fileInput.addEventListener('change', function() {
            if (this.files.length) handleFile(this.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showStatus('Vui lòng chỉ chọn file hình ảnh!', 'error');
                return;
            }
            currentFile = file;
            
            const reader = new FileReader();
            reader.onload = e => {
                imagePreview.src = e.target.result;
                dropZone.style.display = 'none';
                previewContainer.style.display = 'block';
                submitBtn.style.display = 'block';
                hideStatus();
            }
            reader.readAsDataURL(file);
        }

        removeBtn.addEventListener('click', () => {
            currentFile = null;
            fileInput.value = '';
            dropZone.style.display = 'block';
            previewContainer.style.display = 'none';
            submitBtn.style.display = 'none';
            hideStatus();
            resultLink.style.display = 'none';
        });

        function showStatus(text, type) {
            statusMsg.textContent = text;
            statusMsg.className = `status-msg show ${type}`;
        }

        function hideStatus() {
            statusMsg.className = 'status-msg';
            resultLink.style.display = 'none';
        }

        submitBtn.addEventListener('click', () => {
            if (!currentFile) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang tải lên... ⏳';
            removeBtn.style.display = 'none';
            showStatus('Đang gửi ảnh vào hệ thống...', 'loading');

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;

                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        fileName: currentFile.name,
                        mimeType: currentFile.type,
                        base64: base64Data
                    })
                })
                .then(response => response.json())
                .then(result => {
                    if (result.status === "success") {
                        showStatus('Tải lên thành công!', 'success');
                        resultLink.href = result.url;
                        resultLink.style.display = 'block';
                        
                        // Form tự động reset sau 5 giây để bạn thấy được link xem ảnh
                        setTimeout(() => {
                            removeBtn.click();
                        }, 5000);
                    } else {
                        showStatus('Lỗi: ' + result.message, 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Tải Ảnh Lên';
                        removeBtn.style.display = 'block';
                    }
                })
                .catch(error => {
                    showStatus('Lỗi kết nối mạng, vui lòng thử lại!', 'error');
                    console.error(error);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Tải Ảnh Lên';
                    removeBtn.style.display = 'block';
                });
            };

            reader.readAsDataURL(currentFile);
        });
    </script>
</body>
</html>
