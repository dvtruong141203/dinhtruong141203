<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Cập nhật đơn</title>
  <style>
    :root { --bg: #09090b; --surface: rgba(24, 24, 27, 0.7); --border: rgba(255,255,255,0.1); --text: #fafafa; --muted: #a1a1aa; --primary: #3b82f6; --primary-glow: rgba(59, 130, 246, 0.3); --success: #34d399; --danger: #fb7185; }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;}
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 20px 100px 20px; background-image: radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.15), transparent 40%); background-attachment: fixed; }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 30px; padding: 40px; width: 100%; max-width: 480px; backdrop-filter: blur(20px); box-shadow: 0 25px 50px rgba(0,0,0,0.5); animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .title { font-size: 24px; font-weight: 800; margin-bottom: 8px; text-align: center; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 30px; text-align: center; }
    
    .input-wrapper { background: rgba(0,0,0,0.3); border: 2px solid var(--border); border-radius: 20px; padding: 18px; margin-bottom: 20px; transition: 0.3s; text-align: left; }
    .input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
    .input-wrapper label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
    .input-wrapper input, .input-wrapper select { width: 100%; background: transparent; border: none; color: var(--text); font-size: 16px; font-weight: 700; outline: none; }
    .input-wrapper select { cursor: pointer; }
    .input-wrapper select option { background: var(--bg); color: var(--text); }
    
    .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 18px; border-radius: 18px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 10px 25px var(--primary-glow);}
    .btn-submit:active { transform: scale(0.96); }
    .btn-submit:disabled { opacity: 0.5; pointer-events: none; }
    .msg { margin-top: 20px; font-weight: 600; font-size: 14px; text-align: center; }

    /* MENU DƯỚI CÙNG */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(24,24,27,0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 10px calc(12px + env(safe-area-inset-bottom)); z-index: 1000; }
    .bottom-nav a { text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; }
    .bottom-nav a:hover, .bottom-nav a.active { color: var(--primary); }
    .bottom-nav a svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

  <!-- KHUNG 1: TÌM KIẾM -->
  <div class="card" id="searchBox">
    <div class="title">Sửa Thông Tin Đơn</div>
    <div class="subtitle">Tìm mã giao dịch để mở quyền chỉnh sửa</div>

    <div class="input-wrapper">
      <label>Mã giao dịch cần sửa</label>
      <input type="text" id="findId" style="font-family:monospace;" placeholder="VD: 260901123456" autocomplete="off">
    </div>

    <button class="btn-submit" id="btnFind" style="background:#fff; color:#000;" onclick="timDonDeSua()">TÌM KIẾM ĐƠN</button>
    <div id="searchMsg" class="msg"></div>
  </div>

  <!-- KHUNG 2: CHỈNH SỬA THÔNG TIN CHI TIẾT (Ẩn đi, chỉ hiện khi tìm thấy) -->
  <div class="card" id="editBox" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
      <h3 style="font-weight: 800; font-size: 18px;">CẬP NHẬT DỮ LIỆU</h3>
      <button style="background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer;" onclick="quayLai()">Tìm mã khác</button>
    </div>

    <div class="input-wrapper" style="opacity: 0.5; background:transparent;">
      <label>Mã giao dịch (Không thể đổi)</label>
      <input type="text" id="editId" readonly style="font-family:monospace;">
    </div>

    <div class="input-wrapper">
      <label>Số tiền</label>
      <input type="text" id="editAmount" inputmode="numeric" oninput="formatTien(this)">
    </div>

    <div class="input-wrapper">
      <label>Trạng thái</label>
      <select id="editStatus">
        <option value="Chờ thanh toán">Chờ thanh toán</option>
        <option value="Đã thanh toán">Đã thanh toán</option>
        <option value="Thất bại">Thất bại</option>
      </select>
    </div>

    <div class="input-wrapper">
      <label>Thời gian thanh toán</label>
      <input type="text" id="editPayTime" placeholder="VD: 08:15:20 01/09/2026">
    </div>

    <button class="btn-submit" id="btnSubmit" onclick="guiCapNhat()">LƯU THAY ĐỔI VÀO HỆ THỐNG</button>
    <div id="msg" class="msg"></div>
  </div>

  <div class="bottom-nav">
    <a href="data.html"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Danh sách</a>
    <a href="add.html"><svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg>Nạp tiền</a>
    <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Tra cứu</a>
    <a href="edit.html" class="active"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Cập nhật</a>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxLcE6Omn3QKXFi1SBB7A4CtsEjr-iB_qNQ5qrjy5AHagHsjTufNFA9MNqUTmq0ggle/exec";
    
    // Hàm chuẩn hóa Trạng Thái
    function chuanHoaTrangThai(rawStatus) {
      if (rawStatus.includes('Chờ')) return 'Chờ thanh toán';
      if (rawStatus.includes('Đã') || rawStatus.includes('Hoàn')) return 'Đã thanh toán';
      return 'Thất bại';
    }

    function formatTien(el) {
      let raw = el.value.replace(/[^0-9]/g, '');
      el.value = raw ? parseInt(raw, 10).toLocaleString('vi-VN') : '';
    }

    function showMsg(elId, msg, isSuccess) {
      document.getElementById(elId).innerHTML = `<span style="color: ${isSuccess ? 'var(--success)' : 'var(--danger)'}">${msg}</span>`;
    }

    function quayLai() {
      document.getElementById("editBox").style.display = "none";
      document.getElementById("searchBox").style.display = "block";
      document.getElementById("msg").innerHTML = "";
    }

    function timDonDeSua() {
      let id = document.getElementById("findId").value.trim();
      if(!id) return showMsg("searchMsg", "Vui lòng nhập Mã Giao Dịch", false);
      
      const btn = document.getElementById("btnFind");
      btn.disabled = true; btn.innerText = "ĐANG TÌM...";
      document.getElementById("searchMsg").innerHTML = ""; 
      
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'exportJSON', id: id }) })
      .then(r => r.json()).then(res => {
        btn.disabled = false; btn.innerText = "TÌM KIẾM ĐƠN";
        if(res.success && res.data) {
          
          document.getElementById("searchBox").style.display = "none";
          document.getElementById("editBox").style.display = "block";

          document.getElementById("editId").value = res.data.maGiaoDich;
          document.getElementById("editAmount").value = res.data.soTien.toLocaleString('vi-VN');
          
          // Gắn chuẩn 3 từ cho thẻ <select>
          let stt = chuanHoaTrangThai(res.data.trangThai);
          document.getElementById("editStatus").value = stt;
          
          let payTime = res.data.hoanTatLuc;
          document.getElementById("editPayTime").value = (payTime.includes('---') || stt === 'Chờ thanh toán') ? "" : payTime;
          
        } else showMsg("searchMsg", "❌ Không tìm thấy mã này", false);
      }).catch(e => { btn.disabled = false; btn.innerText = "TÌM KIẾM ĐƠN"; showMsg("searchMsg", "❌ Lỗi mạng", false); });
    }

    function guiCapNhat() {
      let id = document.getElementById("editId").value.trim();
      let amount = parseInt(document.getElementById("editAmount").value.replace(/\./g, ''), 10) || 0;
      let status = document.getElementById("editStatus").value;
      let payTime = document.getElementById("editPayTime").value.trim();
      
      if(amount === 0) return showMsg("msg", "❌ Số tiền không hợp lệ", false);

      let payload = { action: 'updateRecord', id: id, amount: amount, status: status, paymentTime: payTime };

      // Chỉnh lại giờ khi trạng thái là "Đã thanh toán" mà chưa có giờ
      if(status === 'Đã thanh toán' && payTime === "") {
        let d = new Date();
        payload.paymentTime = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        document.getElementById("editPayTime").value = payload.paymentTime;
      }

      const btn = document.getElementById("btnSubmit");
      btn.disabled = true; btn.innerText = "ĐANG LƯU...";
      
      fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
      .then(r => r.json()).then(data => {
        btn.disabled = false; btn.innerText = "LƯU THAY ĐỔI VÀO HỆ THỐNG";
        if(data.success) {
          showMsg("msg", `✅ Cập nhật thành công đơn #${id}`, true);
        } else showMsg("msg", "❌ " + data.message, false);
      }).catch(e => { btn.disabled = false; btn.innerText = "LƯU THAY ĐỔI VÀO HỆ THỐNG"; showMsg("msg", "❌ Lỗi mạng", false); });
    }
  </script>
</body>
</html>
